<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost Seahorse | Game Loading Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color: #dce9f8;
        font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(160deg, #031828, #02111b 60%, #000911);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        overflow: hidden;
      }
      .card {
        padding: 28px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        text-align: center;
        box-shadow: 0 15px 60px rgba(0, 0, 0, 0.45);
        max-width: 460px;
      }
      h1 { font-size: 28px; margin-bottom: 10px; }
      p { color: #9ab6c9; line-height: 1.6; }
      a {
        display: inline-flex;
        margin-top: 18px;
        padding: 12px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        color: #031018;
        background: linear-gradient(120deg, #36d1dc, #5b8df3);
        box-shadow: 0 10px 35px rgba(54, 209, 220, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Game surfacing soon.</h1>
      <p>We're sculpting the underwater adventure. Stay tuned for the full dive.</p>
      <a href="/">Back to landing</a>
    </div>
  </body>
</html>
